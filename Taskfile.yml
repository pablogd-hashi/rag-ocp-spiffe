version: "3"

vars:
  COMPOSE: docker compose
  VAULT_NAMESPACE: vault
  RAG_NAMESPACE: rag-platform
  VAULT_ADDR: http://localhost:8200
  VAULT_TOKEN: root
  IMAGE_REGISTRY: image-registry.openshift-image-registry.svc:5000

tasks:

  # ── Entry points ────────────────────────────────────────────────────────

  default:
    silent: true
    cmds:
      - |
        echo ""
        echo "  RAG Platform — Qdrant Learning Lab"
        echo ""
        echo "  ── Cloud / Learning Lab ─────────────────────────────────────────"
        echo "  task cloud:status  Check Qdrant Cloud connection + collection info"
        echo "  task cloud:demo    Start demo against Qdrant Cloud (no local Qdrant)"
        echo "  task lab           Start the interactive Lab UI (Streamlit)"
        echo "  task lab:install   Install lab-ui Python dependencies"
        echo ""
        echo "  ── Week experiments ─────────────────────────────────────────────"
        echo "  task w0:explore    Week 0: connect and explore Qdrant Cloud"
        echo "  task w0:ops        Week 0: collection CRUD and config"
        echo "  task w0:filters    Week 0: payload filters and multi-tenancy"
        echo "  task w0:migrate    Week 0: migrate docs to Qdrant Cloud"
        echo ""
        echo "  task w1:distance   Week 1: distance metric comparison"
        echo "  task w1:hnsw       Week 1: HNSW recall vs latency benchmark"
        echo "  task w1:quant      Week 1: quantization memory vs recall"
        echo ""
        echo "  task w2:embed      Week 2: embedding model comparison"
        echo "  task w2:chunking   Week 2: chunking strategies (fixed/sentence/paragraph, named vectors)"
        echo "  task w2:hybrid     Week 2: hybrid dense+sparse search"
        echo ""
        echo "  task w3:bench      Week 3: concurrent query throughput benchmark"
        echo "  task w3:eval       Week 3: retrieval quality eval with MRR@K"
        echo ""
        echo "  task w4:tenants    Week 4: multi-tenancy patterns (A vs B)"
        echo "  task w4:reranking  Week 4: cross-encoder reranking"
        echo ""
        echo "  ── Original demo ────────────────────────────────────────────────"
        echo "  task demo          Pull models, ingest docs, open UI, interactive Q&A"
        echo "  task demo:ocp      Full OpenShift demo (Vault PKI + Consul mTLS + SPIFFE)"
        echo "  task ask           Ask a question"
        echo "  task ingest        Re-ingest docs"
        echo "  task open          Open Streamlit UI in browser"
        echo "  task status        Show running services"
        echo "  task clean         Stop everything and remove volumes"
        echo ""
        echo "  task status:ocp    OpenShift service status"
        echo "  task logs:ocp      OpenShift logs  (task logs:ocp -- query-service)"
        echo "  task clean:ocp     Remove all OpenShift resources"
        echo ""

  # ── Qdrant Cloud / Lab ──────────────────────────────────────────────────

  cloud:status:
    desc: Check Qdrant Cloud connection and print collection stats
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-0/experiments/01_connect_and_explore.py

  cloud:demo:
    desc: Start RAG demo against Qdrant Cloud (Vault+Consul+Ollama local, no Qdrant container)
    cmds:
      - task: _setup-cloud
      - echo "Starting infrastructure (Vault + Consul — Qdrant is in the cloud)..."
      - "{{.COMPOSE}} up -d vault consul"
      - echo "Ingesting documents to Qdrant Cloud..."
      - "{{.COMPOSE}} run --rm -e QDRANT_URL -e QDRANT_API_KEY ingest"
      - echo "Starting services..."
      - "{{.COMPOSE}} up -d query-service ui"
      - sleep 3
      - echo ""
      - echo "  UI        -> http://localhost:8501"
      - echo "  Query API -> http://localhost:8000/docs"
      - echo "  Lab UI    -> localhost:8502  (task lab)"
      - echo ""
      - open http://localhost:8501 2>/dev/null || true

  lab:
    desc: Start the interactive Qdrant Lab UI (Streamlit multi-page app)
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        cd lab-ui && streamlit run app.py --server.port 8502

  lab:ocp:
    desc: Deploy Lab UI to OpenShift
    cmds:
      - oc apply -f k8s/lab-ui/

  lab:install:
    desc: Install lab-ui dependencies with uv
    cmds:
      - uv pip install -r lab-ui/requirements.txt

  setup:
    desc: Install core deps (weeks 0-1 + notebook) — fast, no onnxruntime
    cmds:
      - uv pip install -r weeks/requirements-core.txt
      - echo "Done. Run 'task w0:migrate' to ingest docs."
      - echo "For week 2 experiments (fastembed) run task setup:ml"

  setup:ml:
    desc: Install ML deps for week 2+ experiments (adds fastembed + onnxruntime ~200MB)
    cmds:
      - uv pip install -r weeks/requirements-ml.txt
      - uv pip install -r lab-ui/requirements.txt
      - echo "Done. All experiments unlocked."

  setup:venv:
    desc: Create isolated venv with uv and install core deps
    cmds:
      - uv venv .venv
      - uv pip install --python .venv/bin/python -r weeks/requirements-core.txt
      - echo "Activate the venv with -- source .venv/bin/activate"

  # ── Week 0 experiments ──────────────────────────────────────────────────

  w0:explore:
    desc: "Week 0 Lab 1 — connect to Qdrant Cloud and explore"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-0/experiments/01_connect_and_explore.py

  w0:ops:
    desc: "Week 0 Lab 2 — collection CRUD, HNSW config, payload indexes"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-0/experiments/02_collection_ops.py

  w0:filters:
    desc: "Week 0 Lab 3 — payload filtering and multi-tenancy simulation"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-0/experiments/03_payload_filters.py

  w0:migrate:
    desc: "Week 0 — migrate docs/ to Qdrant Cloud (server-side inference, no Ollama needed)"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-0/setup/migrate_to_cloud.py

  w0:recover:
    desc: "Week 0 — force-delete a broken collection and verify cluster health"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-0/setup/recover_collection.py

  # ── Week 1 experiments ──────────────────────────────────────────────────

  w1:distance:
    desc: "Week 1 Lab 1 — cosine vs euclidean vs dot product comparison"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-1/experiments/01_distance_metrics.py

  w1:hnsw:
    desc: "Week 1 Lab 2 — HNSW m/ef_construct recall vs latency benchmark"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-1/experiments/02_hnsw_tuning.py

  w1:quant:
    desc: "Week 1 Lab 3 — scalar vs binary quantization memory and recall"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-1/experiments/03_quantization.py

  # ── Week 2 experiments ──────────────────────────────────────────────────

  w2:embed:
    desc: "Week 2 Lab 1 — embedding model comparison (nomic vs bge)"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-2/experiments/01_embedding_comparison.py

  w2:chunking:
    desc: "Week 2 Lab 2 — chunking strategy comparison (fixed/sentence/paragraph, named vectors)"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-2/experiments/02_chunking_strategies.py

  w2:hybrid:
    desc: "Week 2 Lab 3 — hybrid dense+sparse search (BM25 + embeddings)"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-2/experiments/03_hybrid_search.py

  # ── Week 3 experiments ──────────────────────────────────────────────────

  w3:bench:
    desc: "Week 3 Lab 1 — throughput and latency benchmark (concurrent queries)"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-3/experiments/01_benchmark.py

  w3:eval:
    desc: "Week 3 Lab 2 — ground truth retrieval evaluation with MRR@K"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-3/experiments/02_retrieval_eval.py

  # ── Week 4 experiments ──────────────────────────────────────────────────

  w4:tenants:
    desc: "Week 4 Lab 1 — multi-tenancy: payload filter vs per-collection"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-4/experiments/01_multitenancy.py

  w4:reranking:
    desc: "Week 4 Lab 2 — cross-encoder reranking (requires task setup:ml)"
    cmds:
      - |
        set -a; [ -f .env ] && source .env; set +a
        python3 weeks/week-4/experiments/02_reranking.py

  # ── Original demo ────────────────────────────────────────────────────────

  demo:
    desc: Pull models, ingest docs, open UI, interactive Q&A
    cmds:
      - task: _setup-docker
      - echo "Starting infrastructure (Vault + Consul + Qdrant)..."
      - "{{.COMPOSE}} up -d vault consul qdrant"
      - echo "Ingesting documents (waits for Qdrant to be healthy)..."
      - "{{.COMPOSE}} run --rm ingest"
      - echo "Starting platform (bootstrap wires Vault PKI -> Consul CA, then services start)..."
      - "{{.COMPOSE}} up -d"
      - sleep 5
      - echo ""
      - echo "  UI        → http://localhost:8501"
      - echo "  Query API → http://localhost:8000/docs"
      - 'echo "  Vault UI  -> http://localhost:8200  (token: root)"'
      - 'echo "  Consul UI -> http://localhost:8500"'
      - echo ""
      - open http://localhost:8501 2>/dev/null || true
      - ./scripts/walkthrough.sh

  demo:ocp:
    desc: Full OpenShift demo — Vault PKI + Consul Connect mTLS + SPIFFE + RAG
    cmds:
      - task: setup:ocp
      - |
        pkill -f "port-forward.*vault" || true
        pkill -f "port-forward.*consul" || true
        sleep 1
        oc port-forward -n {{.VAULT_NAMESPACE}} svc/vault 8200:8200 > /dev/null 2>&1 &
        oc port-forward -n consul svc/consul-ui 8500:80 > /dev/null 2>&1 &
        sleep 2
      - task: _deploy-rag
      - echo ""
      - |
        UI_URL=$(oc get route ui -n {{.RAG_NAMESPACE}} -o jsonpath='{.spec.host}' 2>/dev/null || echo "not-exposed")
        echo "  Streamlit UI  → https://$UI_URL"
        echo "  Vault UI      → http://localhost:8200  (token: root)"
        echo "  Consul UI     → http://localhost:8500"
        echo "  OCP Console   → https://console-openshift-console.apps-crc.testing"
        echo ""
        echo "  Consul UI shows: service topology, mTLS status, SPIFFE certificates"
        echo "  Vault UI shows:  PKI mounts (connect_root, connect_inter), policies"
      - echo ""
      - ./scripts/walkthrough.sh

  # ── Daily use ───────────────────────────────────────────────────────────

  ask:
    desc: Ask a question (task ask -- "..." or prompts if omitted)
    cmds:
      - |
        Q="{{.CLI_ARGS}}"
        if [ -z "$Q" ]; then
          printf "Question: "
          read -r Q
        fi
        ./scripts/ask.sh "$Q"

  ingest:
    desc: Re-ingest documents after adding files to docs/
    cmds:
      - "{{.COMPOSE}} run --rm ingest"

  open:
    desc: Open Streamlit UI in browser
    cmds:
      - open http://localhost:8501 2>/dev/null || xdg-open http://localhost:8501 2>/dev/null || true

  status:
    desc: Show running Docker services
    cmds:
      - "{{.COMPOSE}} ps"

  logs:
    desc: Stream Docker logs (task logs -- <service>)
    cmds:
      - "{{.COMPOSE}} logs -f {{.CLI_ARGS}}"

  clean:
    desc: Stop containers and remove volumes
    cmds:
      - "{{.COMPOSE}} down -v --remove-orphans"
      - docker rm -f vault consul bootstrap qdrant-sidecar query-service-sidecar ui-sidecar 2>/dev/null || true
      - echo "✓ Done"

  # ── OpenShift ───────────────────────────────────────────────────────────

  setup:ocp:
    desc: Start CRC, build images, deploy Vault + Consul
    cmds:
      - task: _setup-crc
      - task: _build-images
      - task: _deploy-infrastructure

  status:ocp:
    desc: Show OpenShift service status
    cmds:
      - echo "=== CRC ==="
      - crc status
      - echo ""
      - echo "=== Vault ==="
      - oc get pods -n {{.VAULT_NAMESPACE}}
      - echo ""
      - echo "=== Consul ==="
      - oc get pods -n consul
      - echo ""
      - echo "=== RAG Platform ==="
      - oc get pods -n {{.RAG_NAMESPACE}}
      - echo ""
      - echo "=== Routes ==="
      - oc get routes -n {{.RAG_NAMESPACE}}

  logs:ocp:
    desc: Stream OpenShift logs (task logs:ocp -- <service>)
    cmds:
      - |
        SERVICE={{.CLI_ARGS}}
        if [ -z "$SERVICE" ]; then
          echo "Usage: task logs:ocp -- <service>"
          echo "Services: vault, consul, qdrant, ollama, query-service, ui, ingest"
          exit 1
        fi
        case $SERVICE in
          consul) oc logs -f -l app=consul -n consul ;;
          vault)  oc logs -f -l app=vault -n {{.VAULT_NAMESPACE}} ;;
          *)      oc logs -f -l app=$SERVICE -n {{.RAG_NAMESPACE}} ;;
        esac

  clean:ocp:
    desc: Remove all OpenShift resources (forced)
    cmds:
      - pkill -f "port-forward.*vault" || true
      - pkill -f "port-forward.*consul" || true
      - oc delete project {{.RAG_NAMESPACE}} --wait=false 2>/dev/null || true
      - helm uninstall consul -n consul --no-wait 2>/dev/null || true
      - oc delete secret -n consul -l "name=consul,owner=helm" --wait=false 2>/dev/null || true
      - oc delete all --all -n consul --wait=false 2>/dev/null || true
      - |
        oc get namespace consul -o json 2>/dev/null \
          | python3 -c "import sys,json; d=json.load(sys.stdin); d['spec']['finalizers']=[]; print(json.dumps(d))" \
          | oc replace --raw /api/v1/namespaces/consul/finalize -f - 2>/dev/null || true
      - oc delete project consul --wait=false 2>/dev/null || true
      - oc delete project {{.VAULT_NAMESPACE}} --wait=false 2>/dev/null || true
      - echo "✓ Done"

  stop:ocp:
    desc: Stop CRC
    cmds:
      - crc stop
      - echo "✓ CRC stopped"

  # ── Internal ────────────────────────────────────────────────────────────

  _setup-cloud:
    internal: true
    desc: "Cloud demo setup — only phi3 needed (embedding handled by Qdrant Cloud)"
    cmds:
      - echo "Checking Ollama..."
      - |
        if ! ollama list >/dev/null 2>&1; then
          echo "Error: Ollama is not running. Start it with: ollama serve"
          exit 1
        fi
      - echo "Pulling phi3 (LLM for answer generation)..."
      - ollama pull phi3
      - echo "✓ phi3 ready  (embedding skipped — Qdrant Cloud handles it)"

  _setup-docker:
    internal: true
    cmds:
      - echo "Checking Ollama..."
      - |
        if ! ollama list >/dev/null 2>&1; then
          echo "Error: Ollama is not running. Start it with: ollama serve"
          exit 1
        fi
      - ollama pull nomic-embed-text
      - ollama pull phi3
      - echo "✓ Models ready"
      - "{{.COMPOSE}} pull qdrant"
      - echo "✓ Docker setup complete"

  _setup-crc:
    internal: true
    cmds:
      - echo "Configuring CRC..."
      - crc config set memory 20480
      - crc config set cpus 6
      - crc config set enable-cluster-monitoring false
      - echo "Starting CRC (this takes a few minutes)..."
      - crc start --bundle ~/.crc/cache/crc_vfkit_4.18.2_arm64.crcbundle
      - |
        eval $(crc oc-env)
        echo "Waiting for API server at https://api.crc.testing:6443..."
        for i in $(seq 1 60); do
          printf "  attempt %d/60 ... " "$i"
          if oc login -u developer -p developer https://api.crc.testing:6443 >/dev/null 2>&1; then
            echo "ready"
            break
          fi
          echo "not ready yet"
          if [ "$i" -eq 60 ]; then
            echo "❌ API server did not become ready after 5 minutes"
            exit 1
          fi
          sleep 5
        done
        echo "✓ CRC ready"
        oc new-project {{.VAULT_NAMESPACE}} 2>/dev/null || oc project {{.VAULT_NAMESPACE}}
        oc new-project {{.RAG_NAMESPACE}} 2>/dev/null || oc project {{.RAG_NAMESPACE}}

  _build-images:
    internal: true
    cmds:
      - echo "Building and pushing images to CRC internal registry..."
      - |
        set -e
        KUBEADMIN_PASS=$(crc console --credentials 2>/dev/null | awk '/kubeadmin/{found=1} found && /Password:/{print $2; exit}')
        oc login -u kubeadmin -p "$KUBEADMIN_PASS" https://api.crc.testing:6443 2>&1 | grep -v "^$" | head -1
        oc patch configs.imageregistry.operator.openshift.io/cluster \
          --patch '{"spec":{"defaultRoute":true}}' --type=merge
        oc adm policy add-cluster-role-to-user cluster-admin developer
        echo "Waiting for registry route..."
        for i in $(seq 1 20); do
          REGISTRY=$(oc get route default-route -n openshift-image-registry \
            -o jsonpath='{.spec.host}' 2>/dev/null) && break || sleep 3
        done
        echo "Registry: $REGISTRY"
        docker login -u kubeadmin -p $(oc whoami -t) "$REGISTRY"
        docker build -t "$REGISTRY/{{.RAG_NAMESPACE}}/query-service:latest" ./query-service
        docker push "$REGISTRY/{{.RAG_NAMESPACE}}/query-service:latest"
        docker build -t "$REGISTRY/{{.RAG_NAMESPACE}}/ui:latest" ./ui
        docker push "$REGISTRY/{{.RAG_NAMESPACE}}/ui:latest"
        docker build -t "$REGISTRY/{{.RAG_NAMESPACE}}/ingest:latest" ./ingest
        docker push "$REGISTRY/{{.RAG_NAMESPACE}}/ingest:latest"
        oc login -u developer -p developer https://api.crc.testing:6443 2>&1 | grep -v "^$" | head -1
        echo "✓ Images pushed"

  _deploy-infrastructure:
    internal: true
    cmds:
      - echo "Deploying Vault..."
      - oc new-project {{.VAULT_NAMESPACE}} 2>/dev/null || oc project {{.VAULT_NAMESPACE}}
      - oc new-project {{.RAG_NAMESPACE}} 2>/dev/null || oc project {{.RAG_NAMESPACE}}
      - oc project {{.VAULT_NAMESPACE}}
      - oc apply -f k8s/vault/vault-dev.yaml
      - oc rollout status deployment/vault -n {{.VAULT_NAMESPACE}} --timeout=120s
      - |
        pkill -f "port-forward.*vault" || true
        sleep 2
        oc port-forward -n {{.VAULT_NAMESPACE}} svc/vault 8200:8200 > /dev/null 2>&1 &
        sleep 3
      - export VAULT_ADDR={{.VAULT_ADDR}} VAULT_TOKEN={{.VAULT_TOKEN}} && ./scripts/configure-vault.sh
      - 'echo "✓ Vault ready  ->  http://localhost:8200  (token: root)"'
      - echo "Preparing Consul namespace and permissions..."
      - oc create namespace consul --dry-run=client -o yaml | oc apply -f -
      - oc adm policy add-scc-to-group anyuid system:serviceaccounts:consul
      - oc adm policy add-scc-to-group privileged system:serviceaccounts:{{.RAG_NAMESPACE}}
      - |
        if oc get secret consul-gossip-key -n consul &>/dev/null; then
          echo "  Gossip key already exists — skipping"
        else
          GOSSIP_KEY="$(openssl rand -base64 32)"
          oc create secret generic consul-gossip-key \
            --from-literal=key="${GOSSIP_KEY}" \
            -n consul
          echo "  Gossip key created"
        fi
      - echo "Deploying Consul..."
      - |
        helm repo add hashicorp https://helm.releases.hashicorp.com 2>/dev/null || true
        helm repo update
      - |
        STATUS=$(helm status consul -n consul -o json 2>/dev/null \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['status'])" 2>/dev/null || echo "notfound")
        if [ "$STATUS" != "deployed" ] && [ "$STATUS" != "notfound" ]; then
          echo "  Clearing stale Helm release (status: $STATUS)..."
          helm uninstall consul -n consul --no-wait 2>/dev/null || true
          oc delete secret -n consul -l "name=consul,owner=helm" --wait=false 2>/dev/null || true
          oc delete job consul-gateway-resources -n consul --ignore-not-found 2>/dev/null || true
          sleep 3
        fi
      - |
        helm upgrade --install consul hashicorp/consul \
          --namespace consul \
          --create-namespace \
          --version 1.8.11 \
          --values k8s/consul/consul-values.yaml \
          --wait \
          --timeout 5m
      - oc rollout status statefulset/consul-server -n consul --timeout=300s
      - |
        pkill -f "port-forward.*consul" || true
        sleep 2
        oc port-forward -n consul svc/consul-ui 8500:80 > /dev/null 2>&1 &
        echo "✓ Consul ready  ->  http://localhost:8500"
      - echo "✓ Infrastructure ready (Vault + Consul)"

  _deploy-rag:
    internal: true
    cmds:
      - echo "Deploying Service Intentions..."
      - oc project {{.RAG_NAMESPACE}}
      - oc delete serviceintentions --all -n {{.RAG_NAMESPACE}} 2>/dev/null || true
      - oc apply -f k8s/consul/intentions.yaml
      - task: _populate-docs
      - echo "Deploying RAG platform..."
      - oc apply -f k8s/base/
      - oc rollout status statefulset/qdrant -n {{.RAG_NAMESPACE}} --timeout=300s
      - oc rollout status deployment/ollama -n {{.RAG_NAMESPACE}} --timeout=600s
      - echo "Running ingest..."
      - oc delete job ingest -n {{.RAG_NAMESPACE}} --ignore-not-found
      - oc apply -f k8s/base/ingest-job.yaml
      - oc wait --for=condition=complete job/ingest -n {{.RAG_NAMESPACE}} --timeout=300s
      - echo "Exposing UI..."
      - oc expose svc/ui 2>/dev/null || true
      - echo "✓ RAG platform deployed"

  _populate-docs:
    internal: true
    cmds:
      - echo "Loading docs into ConfigMap..."
      - |
        set -e
        CM_ARGS=""
        for f in $(find docs/ -type f \( -name "*.md" -o -name "*.yaml" -o -name "*.tf" \) 2>/dev/null); do
          key=$(echo "$f" | sed 's|docs/||;s|/|_|g')
          CM_ARGS="$CM_ARGS --from-file=${key}=${f}"
        done
        if [ -n "$CM_ARGS" ]; then
          eval "oc create configmap platform-docs $CM_ARGS -n {{.RAG_NAMESPACE}} --dry-run=client -o yaml" | oc apply -f -
          echo "✓ Loaded $(find docs/ -type f \( -name "*.md" -o -name "*.yaml" -o -name "*.tf" \) | wc -l | tr -d ' ') documents"
        else
          echo "Warning: no docs found"
        fi
